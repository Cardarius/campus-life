<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Life | Dorm Room Essentials</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }
    
    /* Header & Cart Button */
    header { position: sticky; top: 0; z-index: 20; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
    .cart-trigger { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.55rem 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
    .cart-count { background: var(--accent); color: #0f172a; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.8rem; }

    /* Hero & Filters */
    .hero { text-align: center; padding: 3rem 1.5rem 1.5rem; max-width: 720px; margin: 0 auto; }
    .hero h1 { font-size: 2.25rem; margin-bottom: 0.5rem; }
    .hero p { color: var(--muted); font-size: 1.05rem; }
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; padding: 1rem 1.5rem 0; }
    .filter-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 0.45rem 0.95rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    /* Product Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1.5rem; max-width: 1150px; margin: 1.75rem auto 4rem; padding: 0 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .clickable-area { cursor: pointer; }
    .product-img { width: 100%; height: 200px; object-fit: cover; background: #0b1120; display: block; border-bottom: 1px solid var(--border); }
    .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
    .badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: var(--accent); font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; margin-bottom: 0.6rem; width: fit-content; }
    .card h2 { font-size: 1.15rem; margin-bottom: 0.35rem; }
    .rating-preview { color: #fbbf24; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .price { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.85rem; }
    
    /* Dual Action Buttons */
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: auto; }
    .btn { padding: 0.65rem 0.75rem; border-radius: 8px; font-weight: 700; font-size: 0.88rem; text-align: center; cursor: pointer; text-decoration: none; border: none; transition: 0.15s; }
    .btn-cart { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-cart:hover { background: rgba(56, 189, 248, 0.12); }
    .btn-buy { background: var(--accent); color: #0f172a; }
    .btn-buy:hover { background: var(--accent-hover); color: #fff; }

    /* Modals & Cart Drawer */
    .overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.78); display: none; z-index: 40; align-items: center; justify-content: center; padding: 1rem; }
    .overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 1.5rem; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: #0f172a; color: var(--text); border: 1px solid var(--border); width: 32px; height: 32px; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; background: #0b1120; }
    .reviews-box { margin-top: 1.25rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .review-item { background: #0f172a; padding: 0.75rem; border-radius: 8px; margin-top: 0.6rem; font-size: 0.85rem; }
    .review-author { font-weight: 700; color: var(--accent); margin-bottom: 0.2rem; }

    .drawer-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.75); display: none; z-index: 50; justify-content: flex-end; }
    .drawer-overlay.open { display: flex; }
